name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Runs against the deterministic parser, so it needs no API key and no
      # database. A prompt or parser change that regresses extraction fails
      # here instead of in someone's CRM.
      - run: npm run eval
        env:
          LLM_PROVIDER: mock
